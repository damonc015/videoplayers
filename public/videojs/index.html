<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Video.js Player</title>
    <link href="https://cdn.jsdelivr.net/npm/video.js@8.21.0/dist/video-js.min.css" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #000;
      }

      #player-section {
        width: 100%;
        height: 100%;
      }

      #vjs-player {
        width: 100%;
        height: 100%;
      }

      /* Make Video.js fill its container */
      .video-js,
      .vjs-tech {
        width: 100% !important;
        height: 100% !important;
        object-fit: fill !important;
      }

      /* ── Custom control bar buttons ───────────────────────── */
      .vjs-custom-sep {
        width: 1px;
        background: rgba(255,255,255,0.25);
        margin: 7px 4px;
        flex-shrink: 0;
        align-self: stretch;
      }

      .vjs-playlist-prev-btn,
      .vjs-playlist-next-btn {
        color: #f5c400 !important;
      }
      .vjs-playlist-prev-btn:hover,
      .vjs-playlist-next-btn:hover {
        color: #fff !important;
      }

      /* Transcript popup */
      .vjs-transcript-btn {
        position: relative;
        display: flex !important;
        align-items: center;
        justify-content: center;
      }
      .vjs-transcript-btn > button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        background: none;
        border: none;
        color: inherit;
        cursor: pointer;
        padding: 0;
      }
      .vjs-transcript-popup {
        display: none;
        position: absolute;
        bottom: calc(100% + 6px);
        right: 0;
        background: rgba(28,28,28,0.95);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 4px;
        min-width: 140px;
        z-index: 500;
        overflow: hidden;
      }
      .vjs-transcript-popup.open { display: block; }
      .vjs-transcript-popup-heading {
        padding: 7px 14px 5px;
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #888;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        cursor: default;
        user-select: none;
      }
      .vjs-transcript-popup ul { list-style: none; }
      .vjs-transcript-popup li {
        padding: 6px 14px;
        font-size: 13px;
        color: #fff;
        cursor: pointer;
        white-space: nowrap;
      }
      .vjs-transcript-popup li:hover { background: rgba(255,255,255,0.1); }

      /* ── Playlist end-card overlay ───────────────────────── */
      #playlist-overlay {
        position: absolute;
        bottom: 60px;
        right: 10px;
        display: flex;
        gap: 10px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s ease;
        z-index: 200;
      }
      #playlist-overlay.visible {
        opacity: 1;
        pointer-events: auto;
      }
      .playlist-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        cursor: pointer;
      }
      .playlist-circle {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        overflow: hidden;
        border: 2px solid rgba(255,255,255,0.45);
        background: rgba(0,0,0,0.35);
        backdrop-filter: blur(3px);
        transition: border-color 0.2s, transform 0.2s;
      }
      .playlist-card:hover .playlist-circle {
        border-color: rgba(255,255,255,0.9);
        transform: scale(1.06);
      }
      .playlist-circle img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.8;
      }
      .playlist-card-label {
        font-size: 10px;
        color: rgba(255,255,255,0.8);
        text-align: center;
        max-width: 90px;
        line-height: 1.3;
        text-shadow: 0 1px 4px rgba(0,0,0,0.9);
      }
    </style>
  </head>
  <body>
    <div id="player-section">
      <video
        id="vjs-player"
        class="video-js vjs-default-skin vjs-big-play-centered"
        controls
        preload="auto"
        playsinline
        crossorigin="anonymous"
        poster=""
      >
        <track id="caption-track" kind="captions" srclang="en" label="English" src="" />
      </video>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/video.js@8.21.0/dist/video.min.js"></script>
    <script>
      // ── Playlist ────────────────────────────────────────────────────────────

      const PLAYLIST = [
        {
          title:  "Esther Horne — Reel 1",
          hlsSrc: "https://stream.dlib.nyu.edu/hls-vod/tamwag/rosie/2_ESTHER_HORNE_REEL_1_manifest.m3u8",
          vttSrc: "https://sites.dlib.nyu.edu/media/api/v0/service/fileserver/av/tamwag/rosie/2_ESTHER_HORNE/2_ESTHER_HORNE_REEL_1.precision.en.vtt",
          poster: "https://dlib.nyu.edu/files/av/tamwag/rosie/2_ESTHER_HORNE/2_ESTHER_HORNE_thumbnail.jpg"
        },
        {
          title:  "Esther Horne — Reel 2",
          hlsSrc: "https://stream.dlib.nyu.edu/hls-vod/tamwag/rosie/2_ESTHER_HORNE_REEL_2_manifest.m3u8",
          vttSrc: "https://sites.dlib.nyu.edu/media/api/v0/service/fileserver/av/tamwag/rosie/2_ESTHER_HORNE/2_ESTHER_HORNE_REEL_2.precision.en.vtt",
          poster: "https://dlib.nyu.edu/files/av/tamwag/rosie/2_ESTHER_HORNE/2_ESTHER_HORNE_thumbnail.jpg"
        },
        {
          title:  "Esther Horne — Reel 3",
          hlsSrc: "https://stream.dlib.nyu.edu/hls-vod/tamwag/rosie/2_ESTHER_HORNE_REEL_3_manifest.m3u8",
          vttSrc: "https://sites.dlib.nyu.edu/media/api/v0/service/fileserver/av/tamwag/rosie/2_ESTHER_HORNE/2_ESTHER_HORNE_REEL_3.precision.en.vtt",
          poster: "https://dlib.nyu.edu/files/av/tamwag/rosie/2_ESTHER_HORNE/2_ESTHER_HORNE_thumbnail.jpg"
        }
      ];

      const currentIndex = Math.max(0, Math.min(
        PLAYLIST.length - 1,
        parseInt(new URLSearchParams(location.search).get("reel") || "0")
      ));
      const currentItem = PLAYLIST[currentIndex];

      // ── Helpers ─────────────────────────────────────────────────────────────

      function navigateTo(index) {
        const p = new URLSearchParams(location.search);
        p.set("reel", index);
        location.href = location.pathname + "?" + p.toString();
      }

      function pad2(n) { return String(Math.floor(n)).padStart(2, "0"); }

      function formatTimeTxt(secs) {
        const h = Math.floor(secs / 3600);
        const m = Math.floor((secs % 3600) / 60);
        const s = (secs % 60).toFixed(3).padStart(6, "0");
        return `${pad2(h)}:${pad2(m)}:${s}`;
      }

      function parseTimestamp(ts) {
        const parts = ts.trim().split(":");
        if (parts.length === 3) return parseFloat(parts[0])*3600 + parseFloat(parts[1])*60 + parseFloat(parts[2]);
        if (parts.length === 2) return parseFloat(parts[0])*60 + parseFloat(parts[1]);
        return 0;
      }

      function parseVttCues(text) {
        const cues = [];
        for (const block of text.split(/\n{2,}/)) {
          const lines = block.trim().split("\n");
          const tsIdx = lines.findIndex(l => l.includes("-->"));
          if (tsIdx < 0) continue;
          const start = parseTimestamp(lines[tsIdx].split("-->")[0]);
          const cueText = lines.slice(tsIdx + 1).join(" ").replace(/<[^>]+>/g, "").trim();
          if (cueText) cues.push({ start, text: cueText });
        }
        return cues;
      }

      function buildTranscriptText(cues) {
        const groups = [];
        let current = null;
        for (const cue of cues) {
          const raw = cue.text.replace(/\n\s*/g, " ").trim();
          if (!raw) continue;
          const m = raw.match(/^(Speaker \d+):\s*/);
          if (m) {
            current = { speaker: m[1], time: cue.start, text: raw.slice(m[0].length) };
            groups.push(current);
          } else if (current) {
            current.text += (current.text ? " " : "") + raw;
          } else {
            current = { speaker: null, time: cue.start, text: raw };
            groups.push(current);
          }
        }
        return groups
          .filter(g => g.text)
          .map(g => (g.speaker ? `${g.speaker} ` : "") + formatTimeTxt(g.time) + "\n" + g.text)
          .join("\n\n") + "\n";
      }

      function openTranscriptTab(vttUrl) {
        fetch(vttUrl)
          .then(r => r.text())
          .then(text => {
            const blob = new Blob([buildTranscriptText(parseVttCues(text))], { type: "text/plain" });
            window.open(URL.createObjectURL(blob), "_blank");
          })
          .catch(e => console.error("Transcript fetch failed:", e));
      }

      // ── SVG icon helper ─────────────────────────────────────────────────────

      const SVG_NS = "http://www.w3.org/2000/svg";
      const PREV_PATH = "M5 17.5v-15h2.5v6.875l6.25-6.25v13.75l-6.25-6.25v6.875z";
      const NEXT_PATH = "M15 2.5v15h-2.5v-6.875l-6.25 6.25v-13.75l6.25 6.25v-6.875z";
      const TRANSCRIPT_PATH = "M0 19.107v-17.857q0-0.446 0.313-0.759t0.759-0.313h8.929v6.071q0 0.446 0.313 0.759t0.759 0.313h6.071v11.786q0 0.446-0.313 0.759t-0.759 0.312h-15q-0.446 0-0.759-0.313t-0.313-0.759zM4.286 15.536q0 0.156 0.1 0.257t0.257 0.1h7.857q0.156 0 0.257-0.1t0.1-0.257v-0.714q0-0.156-0.1-0.257t-0.257-0.1h-7.857q-0.156 0-0.257 0.1t-0.1 0.257v0.714zM4.286 12.679q0 0.156 0.1 0.257t0.257 0.1h7.857q0.156 0 0.257-0.1t0.1-0.257v-0.714q0-0.156-0.1-0.257t-0.257-0.1h-7.857q-0.156 0-0.257 0.1t-0.1 0.257v0.714zM4.286 9.821q0 0.156 0.1 0.257t0.257 0.1h7.857q0.156 0 0.257-0.1t0.1-0.257v-0.714q0-0.156-0.1-0.257t-0.257-0.1h-7.857q-0.156 0-0.257 0.1t-0.1 0.257v0.714zM11.429 5.893v-5.268q0.246 0.156 0.402 0.313l4.554 4.554q0.156 0.156 0.313 0.402h-5.268z";

      function makeSvgIcon(pathD) {
        const svg = document.createElementNS(SVG_NS, "svg");
        svg.setAttribute("viewBox", "0 0 20 20");
        svg.setAttribute("width", "18");
        svg.setAttribute("height", "18");
        svg.setAttribute("fill", "currentColor");
        svg.setAttribute("aria-hidden", "true");
        svg.setAttribute("focusable", "false");
        const path = document.createElementNS(SVG_NS, "path");
        path.setAttribute("d", pathD);
        svg.appendChild(path);
        return svg;
      }

      function makeVjsBtn(extraClass, ariaLabel, pathD, onClick) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `vjs-control vjs-button ${extraClass}`;
        btn.setAttribute("aria-label", ariaLabel);
        btn.appendChild(makeSvgIcon(pathD));
        btn.addEventListener("click", onClick);
        return btn;
      }

      // ── Playlist end-card overlay ───────────────────────────────────────────

      function buildPlaylistOverlay(playerEl) {
        const overlay = document.createElement("div");
        overlay.id = "playlist-overlay";

        PLAYLIST.forEach((item, idx) => {
          if (idx <= currentIndex) return;

          const card = document.createElement("div");
          card.className = "playlist-card";
          card.addEventListener("click", () => navigateTo(idx));

          const circle = document.createElement("div");
          circle.className = "playlist-circle";

          const img = document.createElement("img");
          img.src = item.poster;
          img.alt = item.title;
          circle.appendChild(img);

          const label = document.createElement("span");
          label.className = "playlist-card-label";
          label.textContent = item.title;

          card.appendChild(circle);
          card.appendChild(label);
          overlay.appendChild(card);
        });

        if (overlay.children.length) playerEl.appendChild(overlay);
      }

      let overlayVisible = false;
      function syncOverlay(currentTime, duration) {
        const overlay = document.getElementById("playlist-overlay");
        if (!overlay || !(duration > 0)) return;
        const nearEnd = currentTime >= duration - 20;
        if (nearEnd !== overlayVisible) {
          overlay.classList.toggle("visible", nearEnd);
          overlayVisible = nearEnd;
        }
      }

      // ── Custom control buttons ──────────────────────────────────────────────

      function addControlButtons(player) {
        const controlBar = player.el().querySelector(".vjs-control-bar");
        if (!controlBar) return;

        // Separator
        const sep = document.createElement("div");
        sep.className = "vjs-custom-sep";
        controlBar.appendChild(sep);

        // Prev reel
        if (currentIndex > 0) {
          controlBar.appendChild(makeVjsBtn(
            "vjs-playlist-prev-btn", "Previous reel", PREV_PATH,
            () => navigateTo(currentIndex - 1)
          ));
        }

        // Next reel
        if (currentIndex < PLAYLIST.length - 1) {
          controlBar.appendChild(makeVjsBtn(
            "vjs-playlist-next-btn", "Next reel", NEXT_PATH,
            () => navigateTo(currentIndex + 1)
          ));
        }

        // Transcript button + popup
        const transcriptWrap = document.createElement("div");
        transcriptWrap.className = "vjs-control vjs-button vjs-transcript-btn";

        const popup = document.createElement("div");
        popup.className = "vjs-transcript-popup";

        const heading = document.createElement("div");
        heading.className = "vjs-transcript-popup-heading";
        heading.textContent = "Languages";
        popup.appendChild(heading);

        const ul = document.createElement("ul");
        const li = document.createElement("li");
        li.textContent = "English";
        li.addEventListener("click", e => {
          e.stopPropagation();
          popup.classList.remove("open");
          transcriptBtn.setAttribute("aria-expanded", "false");
          openTranscriptTab(currentItem.vttSrc);
        });
        ul.appendChild(li);
        popup.appendChild(ul);

        const transcriptBtn = document.createElement("button");
        transcriptBtn.type = "button";
        transcriptBtn.setAttribute("aria-label", "View transcript");
        transcriptBtn.setAttribute("aria-haspopup", "menu");
        transcriptBtn.setAttribute("aria-expanded", "false");
        transcriptBtn.appendChild(makeSvgIcon(TRANSCRIPT_PATH));
        transcriptBtn.addEventListener("click", e => {
          e.stopPropagation();
          const isOpen = popup.classList.contains("open");
          popup.classList.toggle("open", !isOpen);
          transcriptBtn.setAttribute("aria-expanded", String(!isOpen));
        });

        transcriptWrap.appendChild(transcriptBtn);
        transcriptWrap.appendChild(popup);
        controlBar.appendChild(transcriptWrap);

        document.addEventListener("click", e => {
          if (!transcriptWrap.contains(e.target)) {
            popup.classList.remove("open");
            transcriptBtn.setAttribute("aria-expanded", "false");
          }
        });
      }

      // ── Init ────────────────────────────────────────────────────────────────

      document.getElementById("vjs-player").poster = currentItem.poster;
      document.getElementById("caption-track").src = currentItem.vttSrc;

      const player = videojs("vjs-player", {
        fluid: false,
        responsive: false,
        controls: true,
        preload: "auto",
        html5: {
          vhs: { overrideNative: true },
          nativeAudioTracks: false,
          nativeVideoTracks: false,
        },
      });

      player.ready(function () {
        // Load HLS source
        player.src({ type: "application/x-mpegURL", src: currentItem.hlsSrc });

        // Custom controls
        addControlButtons(player);

        // Playlist overlay
        buildPlaylistOverlay(player.el());

        // Sync overlay on playback progress
        player.on("timeupdate", () => {
          syncOverlay(player.currentTime(), player.duration());
        });
      });
    </script>
  </body>
</html>
